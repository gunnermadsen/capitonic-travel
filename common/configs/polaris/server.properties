polaris.realm-context.realms=airline-dev
polaris.realm-context.require-header=true
polaris.authentication.token-broker.type=rsa-key-pair
polaris.authentication.token-broker.rsa-key-pair.public-key-file=/run/identity/signing.pub
polaris.authentication.token-broker.rsa-key-pair.private-key-file=/run/identity/signing.key
quarkus.http.host=0.0.0.0
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=disabled
quarkus.http.ssl.certificate.files=/run/identity/tls.crt
quarkus.http.ssl.certificate.key-files=/run/identity/tls.key
# Management health is TLS protected and bound inside the container only.
quarkus.management.host=127.0.0.1
quarkus.management.port=9000
quarkus.management.ssl.certificate.files=/run/identity/tls.crt
quarkus.management.ssl.certificate.key-files=/run/identity/tls.key
quarkus.log.file.enabled=false
