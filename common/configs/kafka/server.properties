process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
controller.listener.names=CONTROLLER
listeners=INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
advertised.listeners=INTERNAL://kafka:9092,HOST://localhost:19092
listener.security.protocol.map=INTERNAL:SSL,CONTROLLER:SSL,HOST:SSL
inter.broker.listener.name=INTERNAL
log.dirs=/var/lib/kafka/data
num.partitions=3
auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
min.insync.replicas=1
log.retention.hours=168
log.retention.bytes=268435456
log.segment.bytes=67108864
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:CN=airline-dev.kafka-broker-1;User:CN=airline-dev.kafka-controller-1;User:CN=airline-dev.kafka-bootstrap-admin
ssl.client.auth=required
ssl.endpoint.identification.algorithm=https
ssl.enabled.protocols=TLSv1.2
ssl.protocol=TLSv1.2
ssl.keystore.type=PKCS12
ssl.truststore.type=PKCS12
ssl.keystore.location=/run/identity/broker.p12
ssl.truststore.location=/run/identity/truststore.p12
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
ssl.keystore.password=${file:/run/identity/password.properties:password}
ssl.key.password=${file:/run/identity/password.properties:password}
ssl.truststore.password=${file:/run/identity/password.properties:password}
listener.name.controller.ssl.keystore.location=/run/identity/controller.p12
