# Local administration is restricted to the postgres OS account.
local   all       postgres                              peer
local   all       all                                   reject
hostnossl all      all               all                 reject
hostssl all       postgres          all                 cert map=service_identities
hostssl airline   airline_migrator  all                 cert map=service_identities
hostssl airline   airline_runtime   all                 cert map=service_identities
hostssl polaris   polaris_owner     all                 cert map=service_identities
hostssl polaris   polaris_runtime   all                 cert map=service_identities
host    all       all               all                 reject
