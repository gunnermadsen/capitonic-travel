name: airline-dev

x-flink-environment: &flink-environment
  JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.bind-host: 0.0.0.0
    jobmanager.rpc.port: 6123
    jobmanager.memory.process.size: 768m
    taskmanager.bind-host: 0.0.0.0
    taskmanager.rpc.port: 6122
    taskmanager.data.port: 6121
    taskmanager.memory.process.size: 1536m
    taskmanager.numberOfTaskSlots: 1
    parallelism.default: 1
    env.java.opts.client: -Xmx256m
    rest.address: flink-jobmanager
    rest.bind-address: 0.0.0.0
    rest.port: 8081
    process.working-dir: /opt/flink/work
    state.backend.type: hashmap
    state.checkpoints.dir: s3://airline-dev-checkpoints/flink/
    state.savepoints.dir: s3://airline-dev-savepoints/flink/
    execution.checkpointing.interval: 10s
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    s3.endpoint: https://rustfs:9000
    s3.path.style.access: true
    s3.connection.ssl.enabled: true
    s3.access-key: $${AWS_ACCESS_KEY_ID}
    s3.secret-key: $${AWS_SECRET_ACCESS_KEY}
    security.ssl.internal.enabled: true
    security.ssl.internal.keystore: /run/identity/internal.p12
    security.ssl.internal.keystore-password: ${STORE_PASSWORD:?Run the operator bootstrap first}
    security.ssl.internal.key-password: ${STORE_PASSWORD}
    security.ssl.internal.truststore: /run/identity/internal-trust.p12
    security.ssl.internal.truststore-password: ${STORE_PASSWORD}
    security.ssl.rest.enabled: true
    security.ssl.rest.authentication-enabled: true
    security.ssl.rest.keystore: /run/identity/rest.p12
    security.ssl.rest.keystore-password: ${STORE_PASSWORD}
    security.ssl.rest.key-password: ${STORE_PASSWORD}
    security.ssl.rest.truststore: /run/identity/rest-trust.p12
    security.ssl.rest.truststore-password: ${STORE_PASSWORD}
    security.ssl.verify-hostname: true
    security.ssl.provider: JDK
    security.ssl.protocol: TLSv1.2
    security.ssl.algorithms: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/identity/s3-trust.jks

x-flink: &flink
  image: airline-dev-flink:2.2.1
  platform: linux/arm64
  build:
    context: ./common/infra/flink
  env_file:
    - ./.local/secrets/flink-s3.env
    - ./.local/secrets/flink-archive.env
  networks: [streaming, lake]
  init: true
  stop_grace_period: 45s

x-initialization: &initialization
  image: node:22.21.1-bookworm-slim@sha256:25b3eb23a00590b7499f2a2ce939322727fcce1b15fdd69754fcd09536a3ae2c
  platform: linux/arm64
  user: "1000:1000"
  working_dir: /workspace
  init: true
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  mem_limit: 256m

services:
  kafka:
    image: apache/kafka:4.4.0@sha256:77b56ddfb7104fc5814a3d0127fcff49983220c7c7ad9bfc1f0af4d439228329
    platform: linux/arm64
    hostname: kafka
    environment:
      CLUSTER_ID: ${CLUSTER_ID:?Run the operator bootstrap first}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:19092:9094"]
    networks: [streaming]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./common/configs/kafka/server.properties:/mnt/shared/config/server.properties:ro
      - ./.local/runtime/kafka:/run/identity:ro
    mem_limit: 1280m
    cpus: 0.75
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, kafka:9092, --command-config, /run/identity/client.properties]
      interval: 30s
      timeout: 15s
      start_period: 45s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:3bc0a69f7636faf49cbddd38901bb688dc7fe3fa6d2e2f87cc56e71890f66bc8
    platform: linux/arm64
    hostname: rustfs
    env_file: ./.local/secrets/rustfs.env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_TLS_PATH: /run/identity
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    networks: [lake]
    volumes:
      - rustfs-data:/data
      - ./.local/runtime/rustfs:/run/identity:ro
    mem_limit: 768m
    cpus: 0.5
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /run/identity/ca.crt, https://rustfs:9000/health/ready]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  flink-jobmanager:
    <<: *flink
    hostname: flink-jobmanager
    command: jobmanager
    environment: *flink-environment
    depends_on:
      rustfs:
        condition: service_healthy
    ports: ["127.0.0.1:18081:8081"]
    volumes:
      - flink-jm-work:/opt/flink/work
      - ./.local/runtime/flink-jobmanager:/run/identity:ro
    mem_limit: 1024m
    cpus: 0.5
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /run/identity/rest-ca.crt, --cert, /run/identity/rest.crt, --key, /run/identity/rest.key, https://flink-jobmanager:8081/overview]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5

  flink-taskmanager:
    <<: *flink
    hostname: flink-taskmanager
    command: taskmanager
    environment:
      <<: *flink-environment
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: '1'
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - flink-tm-work:/opt/flink/work
      - ./.local/runtime/flink-taskmanager:/run/identity:ro
    mem_limit: 1792m
    cpus: 1.25

  kafka-tools:
    image: apache/kafka:4.4.0@sha256:77b56ddfb7104fc5814a3d0127fcff49983220c7c7ad9bfc1f0af4d439228329
    platform: linux/arm64
    profiles: [tools]
    entrypoint: /bin/bash
    networks: [streaming]
    volumes:
      - ./.local/runtime/kafka-tools:/run/identity:ro

  flink-sql-client:
    <<: *flink
    hostname: flink-sql-client
    profiles: [tools]
    command: /opt/flink/bin/sql-client.sh embedded
    environment: *flink-environment
    volumes:
      - ./.local/runtime/flink-sql-client:/run/identity:ro
    mem_limit: 512m

  postgres:
    image: airline-dev-postgres:17.11-timescale2.29.1
    platform: linux/arm64
    build:
      context: ./common/infra/postgres
    hostname: postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/identity/password
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=reject
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    ports: ["127.0.0.1:15432:5432"]
    # Docker requires a routable bridge for loopback host port publication.
    networks: [database, database-host]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./common/configs/postgres:/etc/postgresql:ro
      - ./common/configs/postgres/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
      - ./.local/runtime/postgres:/run/identity:ro
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, gosu, postgres, psql, -X, -U, postgres, -d, airline, -Atqc, "SELECT 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0@sha256:9f85ebe1fdfa9eb1214c4d5d343de29f76fef3dda7b4eb11c6767acc7e6c4fa4
    platform: linux/arm64
    profiles: [tools]
    environment:
      QUARKUS_CONFIG_LOCATIONS: /etc/polaris/database.properties
      QUARKUS_DATASOURCE_USERNAME: polaris_owner
      JAVA_TOOL_OPTIONS: -Xmx256m
    command: [bootstrap, --credentials-file=/run/identity/credentials.json]
    networks: [database]
    volumes:
      - ./common/configs/polaris/database.properties:/etc/polaris/database.properties:ro
      - ./.local/runtime/polaris-bootstrap:/run/identity:ro
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  polaris:
    image: apache/polaris:1.8.0@sha256:74e6416c75f24563fc62f4ed52699d4fb872741b6a3e0af77fdc551b4ee72fce
    platform: linux/arm64
    hostname: polaris
    env_file: ./.local/secrets/polaris-s3.env
    environment:
      QUARKUS_CONFIG_LOCATIONS: /etc/polaris/database.properties,/etc/polaris/server.properties
      QUARKUS_DATASOURCE_USERNAME: polaris_runtime
      JAVA_TOOL_OPTIONS: -Xmx384m -Djavax.net.ssl.trustStore=/run/identity/https-trust.jks
    ports: ["127.0.0.1:18181:8443"]
    networks: [lake, database]
    volumes:
      - ./common/configs/polaris:/etc/polaris:ro
      - ./.local/runtime/polaris:/run/identity:ro
    mem_limit: 768m
    cpus: 0.5
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /run/identity/https-ca.crt, https://localhost:9000/q/health/ready]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 6

  database-migrations:
    <<: *initialization
    command: [node, packages/database-migrations/dist/main.js]
    networks: [database]
    volumes:
      - ./node_modules:/workspace/node_modules:ro
      - ./packages/database-migrations:/workspace/packages/database-migrations:ro
      - ./.local/runtime/database-migrations:/run/identity:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka-topics:
    <<: *initialization
    command: [node, packages/kafka-topics/dist/main.js]
    networks: [streaming]
    environment:
      KAFKA_MODE: local
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./node_modules:/workspace/node_modules:ro
      - ./packages/kafka-topics:/workspace/packages/kafka-topics:ro
      - ./common/configs/kafka/topics:/workspace/common/configs/kafka/topics:ro
      - ./.local/runtime/kafka-topic-manager:/run/identity:ro
    depends_on:
      kafka:
        condition: service_healthy

  ingester:
    environment:
      KAFKA_MODE: local
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./.local/runtime/ingester/tls.crt:/run/identity/tls.crt:ro
      - ./.local/runtime/ingester/tls.key:/run/identity/tls.key:ro
      - ./.local/runtime/ingester/ca.crt:/run/identity/ca.crt:ro
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

networks:
  streaming:
  lake:
  database:
    internal: true
  database-host:
volumes:
  kafka-data:
  rustfs-data:
  flink-jm-work:
  flink-tm-work:
  postgres-data:
