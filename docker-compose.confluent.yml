name: airline-dev

services:
  ingester:
    image: node:22.21.1-bookworm-slim@sha256:25b3eb23a00590b7499f2a2ce939322727fcce1b15fdd69754fcd09536a3ae2c
    platform: linux/arm64
    user: "1000:1000"
    working_dir: /workspace
    command: [flock, --nonblock, --no-fork, /var/lib/ingester/process.lock, node, packages/ingester/dist/main.js]
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    networks: [streaming]
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 45s
    environment:
      KAFKA_MODE: confluent
      KAFKA_BROKER: "pkc-n3603.us-central1.gcp.confluent.cloud:9092"
      CONFLUENT_API_KEY: ${CONFLUENT_API_KEY}
      CONFLUENT_API_SECRET: ${CONFLUENT_API_SECRET}
      KAFKA_FLIGHT_SCHEMA_ID: "100002"
      KAFKA_REJECTION_SCHEMA_ID: "100003"
      INGESTER_PRODUCT: "aeroapi"
      INGESTER_MODE: "PUBLIC"
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY}
      AEROAPI_AIRPORT: "KJFK"
      AEROAPI_POLL_INTERVAL_MS: "300000"
      INGESTER_OUTPUT: "kafka"
      FIREHOSE_USERNAME: "gunnermadsen"
      FIREHOSE_API_KEY: ${FIREHOSE_API_KEY}
      FIREHOSE_AIRPORTS: "KJFK"
      INGESTER_INTERVAL_MS: '1000'
    volumes:
      - ./node_modules:/workspace/node_modules:ro
      - ./packages/ingester:/workspace/packages/ingester:ro
      - ./packages/contracts:/workspace/packages/contracts:ro
      - ingester-state:/var/lib/ingester
    healthcheck:
      test: [CMD, node, packages/ingester/dist/health/probe.js, ready]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  streaming:

volumes:
  ingester-state:
