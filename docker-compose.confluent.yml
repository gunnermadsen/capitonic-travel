name: airline-dev

x-ingester-image: &ingester-image
  image: airline-ingester:local
  build:
    context: .
    dockerfile: packages/ingester/Dockerfile

services:
  ingester-state-init:
    <<: *ingester-image
    user: "0:0"
    entrypoint: [sh, -c]
    command: ["chown -R 1000:1000 /var/lib/ingester"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - ingester-state:/var/lib/ingester

  ingester:
    <<: *ingester-image
    depends_on:
      ingester-state-init:
        condition: service_completed_successfully
    user: "1000:1000"
    working_dir: /workspace
    command: [flock, --nonblock, --no-fork, /var/lib/ingester/process.lock, node, packages/ingester/dist/main.js]
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    networks: [streaming]
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 45s
    environment:
      KAFKA_MODE: confluent
      KAFKA_BROKER: "pkc-n3603.us-central1.gcp.confluent.cloud:9092"
      CONFLUENT_API_KEY: ${CONFLUENT_API_KEY}
      CONFLUENT_API_SECRET: ${CONFLUENT_API_SECRET}
      KAFKA_FLIGHT_SCHEMA_ID: "100002"
      KAFKA_REJECTION_SCHEMA_ID: "100003"
      INGESTER_PRODUCT: "aeroapi"
      INGESTER_MODE: "PUBLIC"
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY}
      AEROAPI_AIRPORT: "KJFK"
      AEROAPI_POLL_INTERVAL_MS: "300000"
      INGESTER_OUTPUT: "kafka"
      FIREHOSE_USERNAME: "gunnermadsen"
      FIREHOSE_API_KEY: ${FIREHOSE_API_KEY}
      FIREHOSE_AIRPORTS: "KJFK"
      INGESTER_INTERVAL_MS: '1000'
    volumes:
      - ingester-state:/var/lib/ingester
    healthcheck:
      test: [CMD, node, packages/ingester/dist/health/probe.js, ready]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  streaming:

volumes:
  ingester-state:
